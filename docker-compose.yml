services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qc
      POSTGRES_PASSWORD: qc
      POSTGRES_DB: qc
    # 仅用于反例复现的隔离库，不暴露端口、不持久化
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qc -d qc"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://qc:qc@db:5432/qc
      SOLVER_TIMEOUT_MS: "10000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
